<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>角色提示詞產生器 v0</title>
  <style>
    :root {
      --bg: #0f1422;
      --bg-elev: #1a2138;
      --bg-card: #131a2e;
      --border: #2a3556;
      --text: #e5e9f5;
      --text-dim: #8b95b7;
      --primary: #4a8eff;
      --accent: #6dd3a4;
      --danger: #ff5c7a;
      --warning: #ffbb44;
    }
    [data-theme="light"] {
      --bg: #f5f7fb;
      --bg-elev: #ffffff;
      --bg-card: #f0f3fa;
      --border: #d8def0;
      --text: #1a1f33;
      --text-dim: #5a6280;
      --primary: #2c5fb8;
      --accent: #2a9d6e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .2s, color .2s;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--bg-elev);
    }
    .logo h1 {
      margin: 0;
      font-size: 1.6rem;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p { margin: .2rem 0 0; color: var(--text-dim); font-size: .85rem; }
    .toolbar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    button {
      background: var(--bg-elev);
      color: var(--text);
      border: 1px solid var(--border);
      padding: .5rem .9rem;
      border-radius: .5rem;
      cursor: pointer;
      font-size: .85rem;
      transition: all .15s;
      font-family: inherit;
    }
    button:hover { border-color: var(--primary); }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.danger-btn { background: transparent; color: var(--danger); border-color: var(--danger); }
    .safety-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: .5rem;
      overflow: hidden;
    }
    .safety-group button {
      border: none;
      border-radius: 0;
      border-right: 1px solid var(--border);
      padding: .45rem .8rem;
      background: transparent;
      font-size: .8rem;
    }
    .safety-group button:last-child { border-right: none; }
    .safety-group button.active {
      background: var(--primary);
      color: #fff;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1rem;
      padding: 1rem 1.5rem;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
      .side { position: static !important; max-height: none !important; }
    }
    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: .8rem;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
      overflow-x: auto;
    }
    .tab {
      flex: 1;
      min-width: 80px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      color: var(--text-dim);
      border-bottom: 2px solid transparent;
      font-weight: 500;
      user-select: none;
      white-space: nowrap;
      font-size: .9rem;
    }
    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--bg-elev);
    }
    .tab-content {
      padding: 1.5rem;
      max-height: 75vh;
      overflow-y: auto;
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: .6rem;
      margin: 0 0 1.2rem;
      padding: 1rem 1.2rem;
    }
    legend {
      padding: 0 .5rem;
      color: var(--primary);
      font-weight: 600;
      font-size: .95rem;
    }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }
    .field label {
      display: block;
      font-size: .8rem;
      color: var(--text-dim);
      margin-bottom: .35rem;
    }
    .field select, .field input {
      width: 100%;
      padding: .5rem .7rem;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: .4rem;
      font-size: .85rem;
      font-family: inherit;
    }
    .field select:focus, .field input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .field .custom-input {
      margin-top: .35rem;
      font-size: .8rem;
    }
    .side {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      position: sticky;
      top: 1rem;
      align-self: start;
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
    }
    .side-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: .8rem;
      padding: 1rem;
    }
    .side-card h3 {
      margin: 0 0 .8rem;
      font-size: .95rem;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
    }
    .prompt-output {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: .5rem;
      padding: .8rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: .82rem;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 80px;
      max-height: 220px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .copy-row {
      display: flex;
      gap: .4rem;
      margin-top: .5rem;
    }
    .copy-row button { flex: 1; }
    .history-item {
      padding: .6rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: .4rem;
      margin-bottom: .5rem;
      font-size: .75rem;
      color: var(--text-dim);
      cursor: pointer;
      max-height: 60px;
      overflow: hidden;
      line-height: 1.4;
    }
    .history-item:hover { border-color: var(--primary); color: var(--text); }
    footer {
      text-align: center;
      padding: 1.2rem;
      color: var(--text-dim);
      font-size: .8rem;
      border-top: 1px solid var(--border);
    }
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #fff;
      padding: .7rem 1.4rem;
      border-radius: 2rem;
      font-size: .85rem;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }
    .negative-area {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: .5rem;
      padding: .55rem;
      margin-top: .35rem;
      width: 100%;
      color: var(--text);
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: .8rem;
      min-height: 60px;
      resize: vertical;
    }
    .bookmark-row {
      display: flex;
      gap: .4rem;
      margin-bottom: .5rem;
    }
    .bookmark-row input, .bookmark-row select { flex: 1; }
    .template-select {
      width: 100%;
      margin-bottom: .8rem;
      padding: .5rem .7rem;
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: .4rem;
      font-family: inherit;
      font-size: .85rem;
    }
    .empty-tip {
      color: var(--text-dim);
      font-size: .85rem;
      padding: 2rem;
      text-align: center;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
  </style>
</head>

    };

    // ============ 渲染 ============
    function renderTabs() {
      const el = document.getElementById("tabs");
      el.innerHTML = TABS.map(t =>
        `<div class="tab ${t.id === state.tab ? 'active' : ''}" data-tab="${t.id}">${t.label}</div>`
      ).join("");
      el.querySelectorAll(".tab").forEach(tabEl => {
        tabEl.onclick = () => {
          state.tab = tabEl.dataset.tab;
          renderTabs();
          renderTabContent();
        };
      });
    }

    function renderTabContent() {
      const fields = allowedFields().filter(f => f.tab === state.tab);
      const groups = {};
      fields.forEach(f => { (groups[f.group] = groups[f.group] || []).push(f); });

      const el = document.getElementById("tabContent");
      const html = Object.entries(groups).map(([group, gFields]) => `
        <fieldset>
          <legend>${group}</legend>
          <div class="field-grid">
            ${gFields.map(renderField).join("")}
          </div>
        </fieldset>
      `).join("");
      el.innerHTML = html || `<div class="empty-tip">這個分頁在當前安全模式下沒有可用欄位。<br/>切換到「標準」或「NSFW」可看到更多。</div>`;

      el.querySelectorAll("[data-field]").forEach(input => {
        const key = input.dataset.field;
        const role = input.dataset.role;
        const handler = (e) => {
          if (role === "custom")    state.customs[key] = e.target.value;
          else if (role === "name") state.name = e.target.value || "Protagonist";
          else                       state.values[key] = e.target.value;
          renderPrompt();
        };
        input.addEventListener("change", handler);
        input.addEventListener("input", handler);
      });
    }

    function renderField(f) {
      if (f.type === "text") {
        return `<div class="field">
          <label>${f.label}</label>
          <input type="text" data-field="${f.key}" data-role="name" value="${escapeAttr(state.name)}" placeholder="${f.placeholder || ''}" />
        </div>`;
      }
      const opts = ['<option value="">-- 無 --</option>']
        .concat(f.options.map(o =>
          `<option value="${escapeAttr(o.en)}" ${state.values[f.key] === o.en ? 'selected' : ''}>${o.zh} (${o.en})</option>`
        ));
      return `<div class="field">
        <label>${f.label}</label>
        <select data-field="${f.key}">${opts.join("")}</select>
        ${f.custom ? `<input class="custom-input" type="text" data-field="${f.key}" data-role="custom" placeholder="自訂…" value="${escapeAttr(state.customs[f.key] || '')}" />` : ''}
      </div>`;
    }

    function escapeAttr(s) {
      return String(s ?? "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }

    // ============ Prompt 拼接 ============
    function gather() {
      const allow = SAFETY_ALLOW[state.safety];
      const get = key => {
        const f = fieldByKey(key);
        if (!f) return [];
        if (f.safety && !allow.includes(f.safety)) return [];
        const arr = [];
        if (state.values[key]) arr.push(state.values[key]);
        const c = (state.customs[key] || "").trim();
        if (c) arr.push(c);
        return arr;
      };
      const flat = (...keys) => keys.flatMap(k => get(k));

      // 把上身/下身的顏色+材質+花紋串到主件之前: "black cotton plaid t-shirt"
      const compose = (mainKey, colorKey, matKey, patKey) => {
        const main = get(mainKey);
        if (!main.length) {
          // 沒有主件時把單獨的顏色/材質/花紋也輸出
          return [...get(colorKey), ...get(matKey), ...get(patKey)];
        }
        const mods = [...get(colorKey), ...get(matKey), ...get(patKey)].filter(Boolean);
        return main.map(m => mods.length ? mods.join(" ") + " " + m : m);
      };

      return {
        name: state.name,
        gender: get("gender")[0] || "",
        age: get("age")[0] || "",
        race: get("race")[0] || "",
        height: get("height")[0] || "",
        build: get("build")[0] || "",
        profession: get("profession").join(", "),

        appearance: flat(
          "hair_style","hair_color","skin","tattoo",
          "expression","eye_color","eye_shape",
          "face_shape","forehead","cheeks","chin",
          "ears","nose_shape","mouth",
          "makeup_base","eyebrows","lip_eye"
        ),

        measurements: flat("bust","waist","hip"),

        clothing: [
          ...get("costume"),
          ...get("outfit_fit"),
          ...get("headwear"),
          ...get("jewelry"),
          ...get("hands"),
          ...get("bag"),
          ...get("outerwear"),
          ...compose("top","top_color","top_material","top_pattern"),
          ...compose("bottom","bottom_color","bottom_material","bottom_pattern"),
          ...get("shoes"),
          ...get("socks")
        ].filter(Boolean),

        action: flat("pose","activity"),

        scene: flat("location","time","weather"),
        sceneDetail: flat("props","detail","texture"),

        lighting: get("lighting")[0] || "",

        camera: flat("lens","aperture","composition","shot","angle"),
        shot: get("shot")[0] || "",

        style: flat("style","effects"),

        ratio: get("ratio")[0] || "",
        expressionRaw: get("expression")[0] || ""
      };
    }

    function buildPrompt() {
      const v = gather();
      const personDesc = [v.age, v.race, v.gender].filter(Boolean).join(" ");
      const bodyDesc   = [v.height, v.build, ...v.measurements].filter(Boolean).join(", ");
      const appearance = v.appearance.join(", ");
      const clothing   = v.clothing.join(", ");
      const action     = v.action.join(", ");
      const scene      = v.scene.join(", ");
      const sceneDetail= v.sceneDetail.join(", ");
      const camera     = v.camera.join(", ");
      const style      = v.style.join(", ");
      const profession = v.profession || "";

      switch (state.template) {
        case "midjourney": {
          const parts = [
            style || "photorealistic, high fashion",
            camera || null,
            `${v.shot || "portrait"} of ${v.name}${personDesc ? `, ${personDesc}` : ''}`,
            profession ? `working as ${profession}` : null,
            appearance,
            bodyDesc,
            clothing ? `wearing ${clothing}` : null,
            action,
            scene ? `in ${scene}` : null,
            sceneDetail,
            v.lighting
          ].filter(Boolean);
          return parts.join(", ") + (v.ratio ? ` ${v.ratio}` : "");
        }
        case "sd_a1111": {
          const parts = [
            "(masterpiece:1.2), (best quality:1.2), highly detailed",
            personDesc, appearance, bodyDesc, clothing, action,
            scene, sceneDetail, v.lighting, camera, style
          ].filter(Boolean);
          return parts.join(", ");
        }
        case "nai": {
          const subject = [personDesc, appearance, bodyDesc, clothing, action].filter(Boolean).join(", ");
          const env = [scene, sceneDetail, v.lighting, camera, style].filter(Boolean).join(", ");
          return `{{masterpiece}}, {{best quality}}, ${subject} BREAK ${env}`;
        }
        case "sora": {
          return `A ${v.shot || "medium shot"} cinematic video clip: ${v.name}` +
                 `${personDesc ? `, a ${personDesc}` : ''}` +
                 `${appearance ? `, ${appearance}` : ''}` +
                 `${clothing ? `, wearing ${clothing}` : ''}. ` +
                 `${action ? `They are ${action}. ` : ''}` +
                 `Scene: ${scene || 'a quiet space'}${sceneDetail ? `, ${sceneDetail}` : ''}, ${v.lighting || 'natural light'}. ` +
                 `Camera: ${camera || 'standard 50mm, eye-level'}. ` +
                 `Style: ${style || 'cinematic, photorealistic'}. ` +
                 `Duration ~6s, smooth handheld motion, 24fps.`;
        }
        case "elevenlabs": {
          return `Voice profile — ${v.age || 'adult'} ${v.gender || 'person'}` +
                 `${v.race ? `, ${v.race} accent` : ''}. ` +
                 `Tone: ${v.expressionRaw || 'neutral'}, warm conversational delivery. ` +
                 `Scene context: ${scene || 'indoors, ambient'}. ` +
                 `Sample line: "Hi, I'm ${v.name}. ${profession ? `I work as ${profession}.` : ''}"`;
        }
        case "character_card": {
          const lines = [
            `# 角色名稱：${v.name}`,
            `## 基本資料`,
            `- 性別：${v.gender || '未設定'}`,
            `- 年齡：${v.age || '未設定'}`,
            `- 種族/國籍：${v.race || '未設定'}`,
            `- 體型：${[v.height, v.build].filter(Boolean).join('、') || '未設定'}`,
            `- 職業：${profession || '未設定'}`,
            v.measurements.length ? `- 三圍：${v.measurements.join('、')}` : null,
            ``,
            `## 外貌`,
            appearance ? `- ${appearance}` : `- (未設定)`,
            ``,
            `## 穿著`,
            clothing ? `- ${clothing}` : `- (未設定)`,
            ``,
            `## 當前狀態 / 場景`,
            action ? `- 動作：${action}` : null,
            scene ? `- 場景：${scene}` : null,
            sceneDetail ? `- 場景細節：${sceneDetail}` : null,
            v.lighting ? `- 光線：${v.lighting}` : null,
            ``,
            `## 鏡頭與風格`,
            camera ? `- 鏡頭：${camera}` : null,
            style ? `- 風格：${style}` : null,
            ``,
            `## 角色扮演指令`,
            `請以這位角色的身份回應使用者，保持人格一致、外貌與背景設定不變。`
          ].filter(l => l !== null);
          return lines.join("\n");
        }
      }
      return "";
    }

    function renderPrompt() {
      const out = buildPrompt();
      document.getElementById("promptOutput").textContent = out || "(請選擇選項)";
    }

    // ============ 快捷功能 ============
    function clearAll() {
      state.values = {};
      state.customs = {};
      state.name = "Protagonist";
      renderTabContent();
      renderPrompt();
      toast("🧹 已清除");
    }

    function randomAll() {
      const allowed = SAFETY_ALLOW[state.safety];
      FIELDS.forEach(f => {
        if (f.type === "text") return;
        if (f.safety && !allowed.includes(f.safety)) {
          delete state.values[f.key];
          return;
        }
        if (Math.random() < 0.30) {
          const o = f.options[Math.floor(Math.random() * f.options.length)];
          state.values[f.key] = o.en;
        } else {
          state.values[f.key] = "";
        }
      });
      renderTabContent();
      renderPrompt();
      toast("🎲 已隨機");
    }

    // ============ 書籤 ============
    function renderBookmarks() {
      const sel = document.getElementById("bookmarkSelect");
      const keys = Object.keys(bookmarks);
      sel.innerHTML = `<option value="">-- 選擇書籤 --</option>` +
        keys.map(k => `<option value="${escapeAttr(k)}">${escapeAttr(k)}</option>`).join("");
    }
    function saveBookmark() {
      const nameInput = document.getElementById("bookmarkName").value.trim();
      const name = nameInput || state.name || `角色_${Date.now()}`;
      bookmarks[name] = {
        values: { ...state.values },
        customs: { ...state.customs },
        name: state.name
      };
      localStorage.setItem("bookmarks_v0", JSON.stringify(bookmarks));
      renderBookmarks();
      toast("✅ 已儲存：" + name);
    }
    function loadBookmark() {
      const name = document.getElementById("bookmarkSelect").value;
      if (!name || !bookmarks[name]) { toast("⚠️ 請先選書籤"); return; }
      const b = bookmarks[name];
      state.values = { ...(b.values || {}) };
      state.customs = { ...(b.customs || {}) };
      state.name = b.name || "Protagonist";
      renderTabContent();
      renderPrompt();
      toast("📥 已載入：" + name);
    }
    function deleteBookmark() {
      const name = document.getElementById("bookmarkSelect").value;
      if (!name) { toast("⚠️ 請先選書籤"); return; }
      delete bookmarks[name];
      localStorage.setItem("bookmarks_v0", JSON.stringify(bookmarks));
      renderBookmarks();
      toast("🗑 已刪除：" + name);
    }
    function exportJson() {
      const blob = new Blob([JSON.stringify(bookmarks, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `prompt_bookmarks_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast("⬇ 已匯出 JSON");
    }
    function importJson(file) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          bookmarks = { ...bookmarks, ...data };
          localStorage.setItem("bookmarks_v0", JSON.stringify(bookmarks));
          renderBookmarks();
          toast("⬆ 已匯入");
        } catch (err) {
          toast("❌ JSON 格式錯誤");
        }
      };
      reader.readAsText(file);
    }

    // ============ 歷史 ============
    function renderHistory() {
      const el = document.getElementById("historyList");
      el.innerHTML = history.length
        ? history.map((h, i) => `<div class="history-item" data-idx="${i}" title="點擊重新複製">${escapeAttr(h.slice(0, 140))}…</div>`).join("")
        : `<div style="color:var(--text-dim);font-size:.8rem">尚無紀錄</div>`;
      el.querySelectorAll(".history-item").forEach(it => {
        it.onclick = () => {
          navigator.clipboard.writeText(history[it.dataset.idx]).then(() => toast("📋 已重新複製"));
        };
      });
    }
    function pushHistory(p) {
      if (!p || p === "(請選擇選項)") return;
      history.unshift(p);
      if (history.length > 20) history = history.slice(0, 20);
      localStorage.setItem("history_v0", JSON.stringify(history));
      renderHistory();
    }

    // ============ 複製 ============
    function copy(withNeg = false) {
      let p = buildPrompt();
      if (!p) { toast("⚠️ 沒有內容"); return; }
      if (withNeg) {
        const neg = document.getElementById("negativeText").value.trim();
        if (neg) p += `\n\nNegative prompt: ${neg}`;
      }
      navigator.clipboard.writeText(p).then(() => {
        toast(withNeg ? "📋 已複製 (含負面詞)" : "📋 已複製");
        pushHistory(p);
      });
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => t.classList.remove("show"), 1800);
    }

    // ============ 主題 ============
    function toggleTheme() {
      const cur = document.body.dataset.theme;
      const next = cur === "dark" ? "light" : "dark";
      document.body.dataset.theme = next;
      document.getElementById("themeBtn").textContent = next === "dark" ? "🌙 深色" : "☀️ 淺色";
      localStorage.setItem("theme_v0", next);
    }

    // ============ 事件綁定 ============
    document.getElementById("themeBtn").onclick = toggleTheme;
    document.getElementById("safetyGroup").onclick = (e) => {
      const s = e.target.dataset.safety;
      if (!s) return;
      state.safety = s;
      document.querySelectorAll("#safetyGroup button").forEach(b =>
        b.classList.toggle("active", b.dataset.safety === s)
      );
      renderTabContent();
      renderPrompt();
    };
    document.getElementById("templateSelect").onchange = (e) => {
      state.template = e.target.value;
      renderPrompt();
    };
    document.getElementById("clearBtn").onclick = clearAll;
    document.getElementById("randomBtn").onclick = randomAll;
    document.getElementById("saveBookmark").onclick = saveBookmark;
    document.getElementById("loadBookmark").onclick = loadBookmark;
    document.getElementById("deleteBookmark").onclick = deleteBookmark;
    document.getElementById("exportJson").onclick = exportJson;
    document.getElementById("importJsonBtn").onclick = () => document.getElementById("importFile").click();
    document.getElementById("importFile").onchange = (e) => {
      if (e.target.files[0]) importJson(e.target.files[0]);
      e.target.value = "";
    };
    document.getElementById("copyBtn").onclick = () => copy(false);
    document.getElementById("copyWithNeg").onclick = () => copy(true);
    document.getElementById("clearHistory").onclick = (e) => {
      e.stopPropagation();
      history = [];
      localStorage.removeItem("history_v0");
      renderHistory();
      toast("🧹 歷史已清");
    };

    // ============ 啟動 ============
    const savedTheme = localStorage.getItem("theme_v0");
    if (savedTheme) {
      document.body.dataset.theme = savedTheme;
      document.getElementById("themeBtn").textContent = savedTheme === "dark" ? "🌙 深色" : "☀️ 淺色";
    }
    renderTabs();
    renderTabContent();
    renderPrompt();
    renderBookmarks();
    renderHistory();
  </script>
</body>
</html>
